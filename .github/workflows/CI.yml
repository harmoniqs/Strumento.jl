name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # No Python step: the mock path runs pure-Julia. Piccolo and PythonCall
      # are weakdeps (extension triggers; issue #16) injected into the test
      # env by the [targets] `test` entry, so Pkg.test runs the full
      # configuration here. PythonCall's interpreter is initialized lazily
      # and never touched by the test suite (StrumentoSoc is not constructed
      # in CI). The base-only / single-trigger configurations are checked
      # locally by test/configurations/load_config_check.jl.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: codecov/codecov-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # TODO(issue #39): REMOVE this step together with the [sources] entry in
      # Project.toml once Intonato 0.5.0 is registered. Until then the shim's
      # Intonato dependency resolves from a sibling path checkout of the
      # unregistered 0.5.0 branch (registered packages must not carry path
      # sources, so neither survives registration).
      - name: Check out unregistered Intonato 0.5 (temporary [sources] path)
        run: git clone --depth 1 --branch amico/issue-53-retire-strumento https://github.com/harmoniqs/Intonato.jl "$GITHUB_WORKSPACE/../Intonato-retire-strumento"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: codecov/codecov-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

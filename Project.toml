name = "Strumento"
uuid = "9a96c2ab-728f-48d1-a688-c746ce4d362f"
authors = ["Harmoniqs"]
version = "0.3.0"

[deps]
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"  # twin core (absorbed from Sosia.jl): OU Gaussian noise
GenericSchur = "c145ed77-6b09-5dd9-b285-bf645a82121e"  # transitive pin only: 0.5.7 breaks eigen! (RalphAS/GenericSchur.jl#24)
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"  # the extension testitems use it in the test env
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"  # twin core: AbstractRNG contract for drift processes
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"  # twin core: seeded, replayable rng
TestItemRunner = "f8b46487-2199-4994-9208-9a1283c18c0a"
TestItems = "1c621080-faea-4a02-84b6-bbd5e436b8fe"
YAML = "ddb6d928-2868-570f-bddf-ab3f9cf99eb6"  # twin core: vault record frontmatter

[weakdeps]
Piccolo = "c4671d76-df94-11ed-2057-43d4fd632fad"  # physics trigger: mock rollouts, AbstractPulse translation
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"  # bridge trigger: the Python delegation soc

[extensions]
StrumentoPiccoloExt = "Piccolo"      # MockSoc + the AbstractPulse translation/seam methods
StrumentoPythonCallExt = "PythonCall"  # StrumentoSoc (the Python `strumento` delegation path)

[compat]
Distributions = "0.25"  # resolved 0.25.131 from General (issue #15)
GenericSchur = "0.5.0 - 0.5.6"  # 0.5.7 piracy regression; drop when fixed
LinearAlgebra = "1.11"
Piccolo = "2.0"  # validated against 2.0.2 (issue #14 rollout re-grounding)
PythonCall = "0.9"
Random = "1.11"
StableRNGs = "1"  # resolved 1.0.4 from General (issue #15)
TestItemRunner = "1.1"
TestItems = "1.0"
YAML = "0.4"  # resolved 0.4.16 from General (issue #15)
julia = "1.12"

[extras]
Piccolo = "c4671d76-df94-11ed-2057-43d4fd632fad"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"  # twin-core tests: stationary statistics
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
# Piccolo + PythonCall ride the test target: `Pkg.test()` runs the FULL
# configuration (both extensions loaded) — CI is unchanged. The base-only and
# single-trigger configurations are checked by
# test/configurations/load_config_check.jl (they cannot go through Pkg.test
# by construction — the test target always injects the triggers).
test = ["Piccolo", "PythonCall", "Statistics", "Test"]